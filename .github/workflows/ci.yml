name: VN App V3 validation
on:
  push:
  pull_request:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate privacy, source policy, intent matching and UI smoke
        run: npm run check
