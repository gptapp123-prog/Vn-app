name: VN App signed iOS IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vn-app-ios-signing
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check required signing secrets
        env:
          VN_APP_APPLE_TEAM_ID: ${{ secrets.VN_APP_APPLE_TEAM_ID }}
          VN_APP_CERTIFICATE_BASE64: ${{ secrets.VN_APP_CERTIFICATE_BASE64 }}
          VN_APP_P12_PASSWORD: ${{ secrets.VN_APP_P12_PASSWORD }}
          VN_APP_PROFILE_BASE64: ${{ secrets.VN_APP_PROFILE_BASE64 }}
          VN_APP_EXPORT_OPTIONS_BASE64: ${{ secrets.VN_APP_EXPORT_OPTIONS_BASE64 }}
        run: |
          python3 - <<'PY'
          import os, sys
          required = ("VN_APP_APPLE_TEAM_ID", "VN_APP_CERTIFICATE_BASE64", "VN_APP_P12_PASSWORD", "VN_APP_PROFILE_BASE64", "VN_APP_EXPORT_OPTIONS_BASE64")
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              print("::error::Thiếu GitHub Secrets: " + ", ".join(missing))
              sys.exit(1)
          PY
  signed-ipa:
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      VN_APP_APPLE_TEAM_ID: ${{ secrets.VN_APP_APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run mobile:sync
      - name: Validate and install temporary signing assets
        env:
          VN_APP_CERTIFICATE_BASE64: ${{ secrets.VN_APP_CERTIFICATE_BASE64 }}
          VN_APP_P12_PASSWORD: ${{ secrets.VN_APP_P12_PASSWORD }}
          VN_APP_PROFILE_BASE64: ${{ secrets.VN_APP_PROFILE_BASE64 }}
          VN_APP_EXPORT_OPTIONS_BASE64: ${{ secrets.VN_APP_EXPORT_OPTIONS_BASE64 }}
        run: python3 scripts/ios-signing.py prepare
      - run: node scripts/ios-build.cjs archive
      - run: npm run ios:export
      - run: python3 scripts/ios-signing.py verify
      - name: Upload signed IPA and signature report
        uses: actions/upload-artifact@v4
        with:
          name: VN-App-iOS-signed-IPA
          path: |
            ios-build/export/*.ipa
            ios-build/export/verification.json
          if-no-files-found: error
          retention-days: 1
      - name: Remove certificate, keychain and profile
        if: always()
        run: python3 scripts/ios-signing.py cleanup

