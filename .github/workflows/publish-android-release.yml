name: Publish verified Android installer
on:
  push:
    branches: [main]
    paths: ['release/**', '.github/workflows/publish-android-release.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: VN-App-Android-release
          run-id: 38156457437
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-input
      - name: Restore verified signed installer
        run: python3 release/restore-signed-apk.py
      - name: Publish installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v3.15.0 VN_App_V3_15_Android_Release.apk SHA256SUMS.txt --target d28e8ed526a6b173570d9d9bec167053b975ddc7 --title "VN App 3.15 — Cài song song" --notes "Cài song song với VN App cũ, không cần gỡ và không xóa dữ liệu cũ. Biểu tượng mới: VN App Mới. Mã gói vn.vnapp.citizen.stable, chữ ký phát hành cố định. Có mục hướng dẫn nhập tệp sao lưu. Android 8 trở lên; chưa kiểm thử trên điện thoại thật."
