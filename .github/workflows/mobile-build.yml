name: VN App mobile build
on:
  push:
    branches: [main]
    paths:
      - "*.js"
      - "*.css"
      - "*.json"
      - "*.txt"
      - "core/**"
      - "mobile/**"
      - "scripts/**"
      - "deploy/**"
      - "assets/**"
      - "android/**"
      - "icon.png"
      - "apple-touch-icon.png"
      - "index.html"
      - "scripts/build-mobile.cjs"
      - ".github/workflows/mobile-build.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: npm ci
      - run: npm run check
      - run: npm run mobile:sync
      - run: chmod +x android/gradlew && cd android && ./gradlew :app:assembleRelease
      - name: Sign release if configured
        env:
          VN_APP_ANDROID_KEYSTORE_BASE64: ${{ secrets.VN_APP_ANDROID_KEYSTORE_BASE64 }}
          VN_APP_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.VN_APP_ANDROID_KEYSTORE_PASSWORD }}
          VN_APP_ANDROID_KEY_ALIAS: ${{ secrets.VN_APP_ANDROID_KEY_ALIAS }}
          VN_APP_ANDROID_KEY_PASSWORD: ${{ secrets.VN_APP_ANDROID_KEY_PASSWORD }}
        run: python3 scripts/sign-android.py
      - uses: actions/upload-artifact@v4
        with:
          name: VN-App-Android-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 1
  ios-simulator:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run mobile:sync
      - run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -configuration Debug -derivedDataPath ios-build CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: VN-App-iOS-Simulator
          path: ios-build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 1
